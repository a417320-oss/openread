name: OpenRead Android APK
on:
  push:
    branches: [main, ocr-epub]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_VARIANT: openread
      CI: true
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: pnpm --filter @readany/app-expo... --filter foliate-js... --filter app... install --frozen-lockfile
      - name: Test Android app configuration and mobile code
        run: |
          node --test deployment/openread-android.test.cjs
          pnpm --filter @readany/app-expo test
          pnpm test:ocr
      - name: Generate Android project
        working-directory: packages/app-expo
        run: |
          pnpm build:reader
          pnpm exec expo prebuild --platform android --no-install
      - name: Build Android release APK
        working-directory: packages/app-expo/android
        run: bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: openread-android-arm64-build
          path: packages/app-expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
